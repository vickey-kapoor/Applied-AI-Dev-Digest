name: Daily Applied AI Dev Digest

# Sends daily AI research digest to Telegram

# Polls every 15 minutes; src/schedule_guard.py decides whether anything is
# actually due. A single daily cron cannot hold a delivery time here: GitHub's
# scheduled delivery is best-effort and this workflow has arrived between 30
# minutes and 5h23m after its slot, which put the digest anywhere from late
# morning to evening. Polling means a late tick is simply followed by another,
# so the digest lands within about one interval of the target.
#
# The target is local noon evaluated in America/Chicago, not a fixed UTC hour,
# so it stays at noon when CDT gives way to CST in November.
#
# Almost every tick exits at the guard step: no pip install, no fetching.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Send a digest now, ignoring the schedule guard'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

# One digest run at a time. Without this a slow run could still be sending
# while the next tick starts, and both would see the same "not yet run" state.
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Runs on the runner's system Python with no dependencies installed —
      # the guard is stdlib-only, so a tick with nothing due costs seconds.
      - name: Check what is due
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run is an explicit instruction; skip the guard.
            REQUESTED="${{ github.event.inputs.job || 'daily' }}"
            echo "Manual dispatch: $REQUESTED"
            [ "$REQUESTED" = "daily" ] && echo "daily=true" >> "$GITHUB_OUTPUT" || echo "daily=false" >> "$GITHUB_OUTPUT"
            [ "$REQUESTED" = "weekly" ] && echo "weekly=true" >> "$GITHUB_OUTPUT" || echo "weekly=false" >> "$GITHUB_OUTPUT"
          else
            echo "daily=$(python3 -m src.schedule_guard check daily)" >> "$GITHUB_OUTPUT"
            echo "weekly=$(python3 -m src.schedule_guard check weekly)" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing due
        if: steps.guard.outputs.daily != 'true' && steps.guard.outputs.weekly != 'true'
        run: echo "Neither digest is due yet — exiting."

      - name: Validate secrets
        if: steps.guard.outputs.daily == 'true' || steps.guard.outputs.weekly == 'true' 
        run: |
          missing=""
          [ -z "${{ secrets.OPENAI_API_KEY }}" ] && missing="$missing OPENAI_API_KEY"
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && missing="$missing TELEGRAM_CHAT_ID"
          [ -z "${{ secrets.KV_REST_API_URL }}" ] && missing="$missing KV_REST_API_URL"
          [ -z "${{ secrets.KV_REST_API_TOKEN }}" ] && missing="$missing KV_REST_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Set up Python
        if: steps.guard.outputs.daily == 'true' || steps.guard.outputs.weekly == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.daily == 'true' || steps.guard.outputs.weekly == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Routing is driven by the guard's own decision, not by which cron
      # fired. Keying off github.event.schedule broke the moment the two
      # daily/weekly crons collapsed into a single */15 poll: the string
      # never matched again, so every tick took the daily branch and the
      # weekly roundup stopped running entirely.
      - name: Send the daily digest
        if: steps.guard.outputs.daily == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: python main.py

      # Marked only after the send succeeds: a step with an `if:` also
      # requires every earlier step to have passed, so a failed send leaves
      # the day unmarked and the next tick retries it.
      - name: Record the daily run
        if: steps.guard.outputs.daily == 'true'
        run: python -m src.schedule_guard mark daily

      - name: Send the weekly roundup
        if: steps.guard.outputs.weekly == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: python weekly_digest.py

      - name: Record the weekly run
        if: steps.guard.outputs.weekly == 'true'
        run: python -m src.schedule_guard mark weekly

      - name: Commit and push reports and data
        if: steps.guard.outputs.daily == 'true' || steps.guard.outputs.weekly == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/ data/
          # Include the UTC time: scheduler drift can put two runs on one date,
          # and a date-only message makes them indistinguishable in the log.
          git diff --staged --quiet || git commit -m "Add daily research digest for $(date -u +'%d-%b-%Y %H:%M') UTC"
          git push

      - name: Annotate on failure
        if: failure()
        run: |
          echo "::error::Applied AI Dev Digest pipeline failed. Check the logs above for details."

