name: Daily Applied AI Dev Digest

# Sends the daily AI research digest to Telegram. One digest a day, nothing else.

# Two ways in, and src/schedule_guard.py decides in both:
#
#   workflow_dispatch  an external scheduler calls this at 12:01 local time.
#                      This is what makes the digest land at noon: dispatches
#                      are delivered immediately, unlike scheduled runs.
#   schedule           an hourly poll, the safety net for a day when nothing
#                      dispatches. On its own it only gets the digest out
#                      "sometime after noon": GitHub's scheduled delivery is
#                      best-effort and this workflow has arrived between 30
#                      minutes and 5h23m after its slot, which put past
#                      digests anywhere from 12:05 to 16:41 local.
#
# The poll was every 15 minutes at first. GitHub honoured roughly one tick
# in twelve at that rate, with gaps of 1.5 to 4.5 hours, so the nominal
# precision was fiction. Asking for less appears to get more.
#
# A dispatch runs the guard like any tick, so an external scheduler that fires
# twice, or fires after the hourly poll already sent, cannot double-send. The
# `force` input is the one bypass, for sending by hand off-schedule.
#
# The target is local noon evaluated in America/Chicago, not a fixed UTC hour,
# so it stays at noon when CDT gives way to CST in November.
#
# Almost every tick exits at the guard step: no pip install, no fetching.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now, even if the guard says the digest is not due'
        type: boolean
        default: false

# One digest run at a time. Without this a slow run could still be sending
# while the next tick starts, and both would see the same "not yet run" state.
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Runs on the runner's system Python with no dependencies installed —
      # the guard is stdlib-only, so a tick with nothing due costs seconds.
      - name: Check what is due
        id: guard
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            # Someone ticked "force" on the Run workflow form: an explicit
            # instruction to send regardless of the time or today's state.
            echo "Forced dispatch: sending the daily digest"
            echo "daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily=$(python3 -m src.schedule_guard check daily)" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing due
        if: steps.guard.outputs.daily != 'true'
        run: echo "The digest is not due yet — exiting."

      - name: Validate secrets
        if: steps.guard.outputs.daily == 'true'
        run: |
          missing=""
          [ -z "${{ secrets.OPENAI_API_KEY }}" ] && missing="$missing OPENAI_API_KEY"
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && missing="$missing TELEGRAM_CHAT_ID"
          [ -z "${{ secrets.KV_REST_API_URL }}" ] && missing="$missing KV_REST_API_URL"
          [ -z "${{ secrets.KV_REST_API_TOKEN }}" ] && missing="$missing KV_REST_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Set up Python
        if: steps.guard.outputs.daily == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.daily == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sending is driven by the guard's own decision, not by which cron
      # fired. Keying off github.event.schedule broke once before, when two
      # crons collapsed into a single polling cron and the string stopped
      # matching anything at all.
      - name: Send the daily digest
        if: steps.guard.outputs.daily == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: python main.py

      # Marked only after the send succeeds: a step with an `if:` also
      # requires every earlier step to have passed, so a failed send leaves
      # the day unmarked and the next tick retries it.
      - name: Record the daily run
        if: steps.guard.outputs.daily == 'true'
        run: python -m src.schedule_guard mark daily

      - name: Commit and push reports and data
        if: steps.guard.outputs.daily == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/ data/
          # Include the UTC time: scheduler drift can put two runs on one date,
          # and a date-only message makes them indistinguishable in the log.
          git diff --staged --quiet || git commit -m "Add daily research digest for $(date -u +'%d-%b-%Y %H:%M') UTC"
          git push

      - name: Annotate on failure
        if: failure()
        run: |
          echo "::error::Applied AI Dev Digest pipeline failed. Check the logs above for details."
