name: CI

# Runs the Python test suite on every pull request and on main. The daily
# digest workflow lives in daily-news.yml and is unaffected by this.
#
# There was a second job here for the Vercel dashboard (Node, tsc, ESLint,
# Vitest). The dashboard is gone and so is the job.

on:
  pull_request:
  push:
    branches: [main]

# Read-only: unlike daily-news.yml, nothing here commits back to the repo.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite mocks every network and OpenAI call, so no secrets are needed.
      - name: Run tests
        run: pytest
