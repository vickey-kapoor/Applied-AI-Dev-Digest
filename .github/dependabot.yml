# Keeps dependencies and GitHub Actions current so known-vulnerable versions
# don't sit in the pipeline unnoticed. The repo pins everything for
# reproducibility; without update automation those pins quietly go stale.
#
# Grouping covers minor and patch updates only. Major updates are deliberately
# left out of the groups so each arrives as its own PR: a grouped PR that
# bundles majors is unmergeable in one go, which is how an earlier all-majors
# group broke the build.
version: 2
updates:
  # Python pipeline dependencies (requirements.txt at the repo root).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The workflow actions themselves (checkout, setup-python).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
